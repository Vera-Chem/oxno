<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>氧了个氧 · 氧化数消消乐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23FFFDF8' stroke='%23463757' stroke-width='4'/%3E%3Ccircle cx='22' cy='28' r='4' fill='%23463757'/%3E%3Ccircle cx='42' cy='28' r='4' fill='%23463757'/%3E%3Cpath d='M24 41q8 7 16 0' stroke='%23463757' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#463757; --ink-2:#6F5C82; --cream:#FFF7EC; --paper:#FFFDF8;
  --mint:#A8E5C6; --peach:#FFB79F; --butter:#FFDC8B; --lav:#CBB9F2; --sky:#A9D9F2; --pink:#FFB2C8;
  --accent:#A8E5C6; --accent-ink:#2E8A63;
  --f-display:"ZCOOL KuaiLe","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --f-num:"Baloo 2","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--f-body); color:var(--ink); background:var(--cream);
  background-image:radial-gradient(rgba(70,55,87,.075) 1.5px,transparent 1.6px);
  background-size:22px 22px;
  overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none;
  -webkit-text-size-adjust:100%;
}
body[data-lv="1"]{--accent:var(--mint);--accent-ink:#2E8A63}
body[data-lv="2"]{--accent:var(--peach);--accent-ink:#B85137}
body[data-lv="3"]{--accent:var(--lav);--accent-ink:#5F45A0}

.app{height:100vh; height:100dvh; display:flex; flex-direction:column;
  padding:0 0 calc(8px + env(safe-area-inset-bottom)); position:relative;}

/* ===== 顶栏 ===== */
.top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 16px 2px}
.brand{display:flex; align-items:center; gap:9px; min-width:0}
.mascot{width:44px; flex:0 0 auto}
.mascot svg{display:block; width:100%; height:auto}
.brand-txt{min-width:0}
h1{font-family:var(--f-display); font-weight:400; font-size:25px; line-height:1.1; margin:0; letter-spacing:.5px}
.sub{margin:3px 0 0; font-size:10.5px; color:var(--ink-2); font-weight:500}
.top-actions{display:flex; gap:6px; flex:0 0 auto}
.icon-btn{width:34px; height:34px; border-radius:50%; border:2px solid var(--ink); background:var(--paper);
  display:grid; place-items:center; color:var(--ink); cursor:pointer; padding:0;
  box-shadow:0 3px 0 rgba(70,55,87,.16); transition:transform .12s, box-shadow .12s}
.icon-btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(70,55,87,.16)}
.icon-btn svg{width:17px; height:17px}
.icon-btn.off{opacity:.45}

/* ===== 关卡与目标 ===== */
.hud{padding:8px 16px 0; display:flex; flex-direction:column; gap:6px}
.tabs{display:flex; gap:6px}
.tab{border:2px solid var(--ink); background:var(--paper); color:var(--ink); border-radius:999px;
  font-family:var(--f-body); font-size:12px; font-weight:700; padding:4px 11px; cursor:pointer;
  box-shadow:0 3px 0 rgba(70,55,87,.14); transition:transform .12s, box-shadow .12s, background .16s}
.tab:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(70,55,87,.14)}
.tab.on{background:var(--accent); box-shadow:0 3px 0 rgba(70,55,87,.28)}
.vrow{display:flex; align-items:center; gap:7px; min-width:0}
.vrow-label{font-size:10.5px; color:var(--ink-2); font-weight:500; flex:0 0 auto}
.vchips{display:flex; gap:4px; flex-wrap:wrap; min-width:0}
.vchip{font-family:var(--f-num); font-weight:800; font-size:12px; line-height:1; background:#fff;
  border:1.5px solid rgba(70,55,87,.24); border-radius:999px; padding:3px 7px 2px; color:var(--ink)}
.vchip.hit{background:var(--butter); border-color:var(--ink)}

/* ===== 牌堆 ===== */
.stage{flex:1 1 0; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px 10px}
.board{position:relative; flex:0 0 auto}
.board::before{content:""; position:absolute; inset:-9px -4px; border-radius:26px;
  background-color:rgba(255,253,247,.88);
  background-image:radial-gradient(rgba(70,55,87,.08) 1.4px, transparent 1.5px);
  background-size:16px 16px;
  box-shadow:inset 0 0 0 2px rgba(70,55,87,.09), 0 4px 0 rgba(70,55,87,.06); z-index:0}
.tile{position:absolute; width:calc(var(--s) * .96); height:calc(var(--s) * 1.16);
  border-radius:calc(var(--s) * .19); border:2px solid var(--ink); background:var(--paper);
  box-shadow:0 4px 0 rgba(70,55,87,.20), inset 0 -3px 0 rgba(70,55,87,.05);
  display:flex; align-items:center; justify-content:center; cursor:pointer; padding:2px 3px;
  transition:transform .14s ease, opacity .16s ease, filter .16s ease; will-change:transform}
.tile:hover{transform:translateY(-2px)}
.tile.blocked{background:#F2EBDD; border-color:#83739A; box-shadow:none; cursor:default}
.tile.blocked .tile-fml{color:#A08FB4}
.tile.blocked .tile-el{opacity:.45}
.tile.blocked:hover{transform:none}
.tile.off{display:none}
.tile.shake{animation:shake .28s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.tile.poke{animation:poke .4s}
@keyframes poke{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
.tile-el{position:absolute; top:calc(var(--s) * .05); left:calc(var(--s) * .06);
  font-family:var(--f-num); font-weight:800; font-size:calc(var(--s) * .17); line-height:1;
  padding:calc(var(--s) * .035) calc(var(--s) * .055); border-radius:999px;
  border:1.5px solid rgba(70,55,87,.45); color:var(--ink)}
.tile-fml{font-family:var(--f-num); font-weight:800; font-size:calc(var(--s) * .29); line-height:1;
  letter-spacing:0; text-align:center; white-space:nowrap}
.tile-val{position:absolute; right:calc(var(--s) * .06); bottom:calc(var(--s) * .05);
  font-family:var(--f-num); font-weight:800; font-size:calc(var(--s) * .19); line-height:1;
  color:var(--accent-ink)}
.tg{background:var(--butter); border-radius:.22em; padding:0 .1em; font-weight:800}
sub{font-size:.66em; vertical-align:-.22em; font-weight:700}
sup{font-size:.62em; vertical-align:.42em; font-weight:700}

/* ===== 槽位 ===== */
.traybar{flex:0 0 auto; padding:6px 14px 0; display:flex; flex-direction:column; gap:4px}
.tray{display:flex; gap:5px; justify-content:center}
.slot{flex:1 1 0; min-width:0; max-width:54px; aspect-ratio:1 / 1.2; border-radius:11px;
  border:2px dashed rgba(70,55,87,.22); background:rgba(255,255,255,.55);
  display:flex; align-items:center; justify-content:center; padding:0 2px; overflow:hidden}
.slot.filled{border:2px solid var(--ink); background:var(--paper); border-style:solid;
  box-shadow:0 3px 0 rgba(70,55,87,.18)}
.slot.pop{animation:pop .26s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.55) translateY(-8px); opacity:.3}100%{transform:scale(1) translateY(0); opacity:1}}
.slot.matched{animation:cleared .38s ease forwards; background:var(--butter)}
@keyframes cleared{0%{transform:scale(1)}40%{transform:scale(1.14) rotate(-4deg)}100%{transform:scale(.4) rotate(6deg); opacity:0}}
.mini-fml{font-family:var(--f-num); font-weight:800; font-size:clamp(9px,3.1vw,13px); line-height:1;
  text-align:center; white-space:nowrap}

/* ===== 道具 ===== */
.tools{flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:8px 14px 16px}
.btn{display:inline-flex; align-items:center; gap:4px; border:2px solid var(--ink); background:var(--paper);
  color:var(--ink); border-radius:999px; padding:5px 10px; font-family:var(--f-body); font-size:11.5px;
  font-weight:700; cursor:pointer; box-shadow:0 3px 0 rgba(70,55,87,.16);
  transition:transform .12s, box-shadow .12s, opacity .16s}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(70,55,87,.16)}
.btn svg{width:14px; height:14px}
.btn .cnt{font-family:var(--f-num); font-weight:800; font-size:10px; background:var(--accent);
  border-radius:999px; padding:1px 5px; line-height:1.3}
.btn[data-tool="hint"]{background:var(--butter)}
.btn[data-tool="undo"]{background:var(--mint)}
.btn[data-tool="shuffle"]{background:var(--sky)}
.btn .cnt{background:rgba(255,255,255,.8); border:1px solid rgba(70,55,87,.35)}
.btn[disabled]{opacity:.38; box-shadow:none; transform:translateY(2px)}
.progress{flex:0 0 76px; margin-left:auto; font-size:10.5px; color:var(--ink-2); font-weight:500; text-align:right; line-height:1.4; white-space:nowrap}
.progress b{font-family:var(--f-num); font-weight:800; font-size:13px; color:var(--ink)}

/* ===== 消除笔记卡 ===== */
.note{position:fixed; left:50%; bottom:calc(140px + env(safe-area-inset-bottom)); transform:translate(-50%,14px);
  width:min(92vw,430px); background:var(--paper); border:2px solid var(--ink); border-radius:16px;
  box-shadow:0 7px 0 rgba(70,55,87,.16); padding:7px 11px 8px; z-index:30;
  opacity:0; pointer-events:none; transition:opacity .22s, transform .22s}
.note.show{opacity:1; transform:translate(-50%,0)}
.note-head{display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700;
  padding-bottom:5px; margin-bottom:5px; border-bottom:1.5px dashed rgba(70,55,87,.18)}
.note-val{font-family:var(--f-num); font-weight:800; font-size:14px; background:var(--butter);
  border:1.5px solid var(--ink); border-radius:8px; padding:1px 7px; line-height:1.35}
.note-row{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:1px 0}
.note-q{font-family:var(--f-num); font-weight:800; font-size:11.5px; white-space:nowrap}
.note-w{font-family:var(--f-num); font-weight:600; font-size:10.5px; color:var(--ink-2); text-align:right}

/* ===== 遮罩弹层 ===== */
.overlay{position:fixed; inset:0; background:rgba(70,55,87,.38); display:none;
  align-items:center; justify-content:center; padding:18px; z-index:60}
.overlay.show{display:flex}
.card{background:var(--paper); border:2.5px solid var(--ink); border-radius:22px;
  box-shadow:0 10px 0 rgba(70,55,87,.22); padding:18px 18px 16px; width:100%; max-width:390px;
  max-height:88vh; overflow:auto}
.card h2{font-family:var(--f-display); font-weight:400; font-size:22px; margin:0 0 4px; letter-spacing:.5px}
.card-sub{margin:0 0 12px; font-size:11px; color:var(--ink-2); font-weight:500}
.rule-list{margin:0 0 12px; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
.rule-list li{display:flex; gap:8px; font-size:12.5px; line-height:1.5}
.rule-list li i{font-family:var(--f-num); font-weight:800; font-style:normal; width:19px; height:19px;
  flex:0 0 auto; border-radius:50%; background:var(--accent); border:1.5px solid var(--ink);
  display:grid; place-items:center; font-size:11px; margin-top:2px}
.panelbox{background:rgba(255,255,255,.75); border:1.5px dashed rgba(70,55,87,.3);
  border-radius:14px; padding:10px 12px; margin:0 0 12px}
.panelbox h3{margin:0 0 6px; font-size:11.5px; font-weight:700; color:var(--ink)}
.panelbox p{margin:0 0 5px; font-size:11.5px; line-height:1.55; color:var(--ink-2)}
.panelbox p:last-child{margin-bottom:0}
.panelbox b{color:var(--ink); font-family:var(--f-num); font-weight:700}
.card-actions{display:flex; gap:8px; margin-top:2px}
.btn-main{flex:1; justify-content:center; background:var(--accent); padding:9px 12px; font-size:13px}
.card h2 .hl{background:var(--butter); border-radius:.3em; padding:0 .18em}

/* ===== 小屏微调 ===== */
@media (max-height:660px){
  h1{font-size:21px}
  .mascot{width:36px}
  .hud{gap:4px; padding-top:5px}
  .tools{padding-bottom:8px}
  .note-row{padding:1px 0}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}

/* ===== 皮肤 v2：更软更萌 ===== */
body{background-color:#FFF3E1}
body::before,body::after{content:""; position:fixed; border-radius:50%; pointer-events:none; z-index:0}
body::before{width:240px; height:240px; background:var(--mint); opacity:.18; top:-120px; right:-86px}
body::after{width:210px; height:210px; background:var(--peach); opacity:.15; bottom:-100px; left:-86px}
.app{z-index:1}

h1{display:inline-block; padding:0 1px 2px;
  background-image:linear-gradient(transparent 60%, rgba(255,220,139,.9) 60%, rgba(255,220,139,.9) 94%, transparent 94%);
  background-repeat:no-repeat; background-size:100% 100%}
.mascot{animation:floaty 3.6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(2deg)}}

.board::before{border-radius:30px; background-color:#FFFBF1;
  background-image:radial-gradient(rgba(110,84,128,.10) 1.4px, transparent 1.5px); background-size:17px 17px;
  box-shadow:inset 0 0 0 2px rgba(110,84,128,.13), 0 6px 0 rgba(110,84,128,.07)}
.board::after{content:""; position:absolute; top:-15px; right:17%; width:62px; height:17px;
  background:rgba(168,229,198,.82); border-radius:4px; transform:rotate(-5deg);
  box-shadow:0 2px 0 rgba(70,55,87,.10); z-index:1}

.tile{border-radius:calc(var(--s) * .21); border-color:#54415F;
  box-shadow:0 4px 0 rgba(84,65,95,.22), inset 0 2px 0 rgba(255,255,255,.92), inset 0 -4px 0 rgba(84,65,95,.05)}
.tile.blocked{background:#F5EEDF; border-color:#9B8CB0}

.peek{position:absolute; left:calc(var(--s) * .02); top:calc(100% + 8px);
  width:calc(var(--s) * .56); z-index:5; pointer-events:none}
.peek svg{display:block; width:100%; height:auto}
@media (max-height:770px){.peek{display:none}}

.tray{background:rgba(255,255,255,.5); border:1.5px solid rgba(84,65,95,.14);
  border-radius:18px; padding:5px 6px}

.card{box-shadow:inset 0 6px 0 var(--accent), 0 10px 0 rgba(84,65,95,.22);
  scrollbar-width:none}
.card::-webkit-scrollbar{width:0; height:0}
.card h2{margin-top:6px}
.card-sign{display:flex; align-items:center; justify-content:center; gap:4px;
  margin-top:10px; padding-top:9px; border-top:1.5px dashed rgba(84,65,95,.2);
  font-family:var(--f-num); font-weight:700; font-size:10.5px; color:var(--ink-2); letter-spacing:.4px; opacity:.85}
.card-sign svg{width:12px; height:12px; flex:0 0 auto}

.top-actions{flex-direction:column; align-items:flex-end; gap:6px}
.top-actions .icons{display:flex; gap:6px}
.vera{display:flex; align-items:center; gap:4px; padding:2px 8px 2px 6px;
  border-radius:999px; background:rgba(255,252,244,.92);
  border:1.2px dashed rgba(84,65,95,.34); transform:rotate(-2deg);
  box-shadow:0 2px 0 rgba(84,65,95,.06); white-space:nowrap}
.vera .chili{width:13px; height:13px; flex:0 0 auto}
.vera .cn{font-family:var(--f-display); font-size:10.5px; color:#6A5578; letter-spacing:.4px}
.vera .en{font-family:var(--f-num); font-style:italic; font-weight:700; font-size:10.5px; color:var(--accent-ink)}

.btn{white-space:nowrap}
@media (max-width:380px){
  .btn{padding:5px 7px; font-size:11px}
  .btn .cnt{font-size:9.5px}
  .progress{flex:0 0 64px; font-size:10px}
  h1{font-size:23px}
  .vera{padding:2px 6px 2px 5px}
  .mascot,.avatar{width:40px; height:40px}
  .sub{font-size:9px; white-space:nowrap}
}

.mascot{width:46px}
.avatar{display:block; width:46px; height:46px; border-radius:50%;
  border:2.5px solid #FFFDF8; background:#FFFDF8;
  box-shadow:0 3px 0 rgba(84,65,95,.16), 0 0 0 1.6px rgba(84,65,95,.16)}

.card-head{display:flex; align-items:center; gap:9px; margin:4px 0 6px}
.card-head h2{margin:0}
.card-ava{width:38px; height:38px; border-radius:50%; flex:0 0 auto;
  border:2px solid #FFFDF8; background:#FFFDF8;
  box-shadow:0 2px 0 rgba(84,65,95,.14), 0 0 0 1.3px rgba(84,65,95,.16)}

.card-sign{gap:6px}
.sign-ava{width:16px; height:16px; border-radius:50%; flex:0 0 auto;
  border:1.5px solid #FFFDF8; background:#FFFDF8;
  box-shadow:0 1px 0 rgba(84,65,95,.12), 0 0 0 1px rgba(84,65,95,.14)}
</style>
</head>
<body data-lv="1">
<div class="app">

  <header class="top">
    <div class="brand">
      <div class="mascot" id="mascot">
        <img class="avatar" id="avaImg" alt="微辣化学 Vera">
      </div>
      <div class="brand-txt">
        <h1>氧了个氧</h1>
        <p class="sub">氧化数消消乐 · oxidation number</p>
      </div>
    </div>
    <div class="top-actions">
      <div class="icons">
      <button class="icon-btn" id="btnRules" aria-label="化合价口诀速查">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5h6a3 3 0 0 1 3 3V19a2.5 2.5 0 0 0-2.5-2.5H4Z"/>
          <path d="M20 5.5h-3.5A3 3 0 0 0 13 8.5"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnSound" aria-label="音效开关">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4Z"/><path d="M16 9.2a4 4 0 0 1 0 5.6"/>
        </svg>
      </button>
      </div>
      <div class="vera" aria-label="微辣化学 Vera">
        <svg class="chili" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17.4 5.6c2.7 1.6 2.4 5.7-.7 9.3-2.5 2.9-6.3 4.4-9.1 3.5" fill="none" stroke="#FF9C7E" stroke-width="4.6" stroke-linecap="round"/>
          <path d="M17.4 5.6c-.7-1.5.4-2.8 2-3" fill="none" stroke="#54415F" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="cn">微辣化学</span><span class="en">Vera</span>
      </div>
    </div>
  </header>

  <div class="hud">
    <div class="tabs" id="tabs"></div>
    <div class="vrow">
      <span class="vrow-label">本关化合价</span>
      <div class="vchips" id="vchips"></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="board" id="board"></div>
  </div>

  <div class="traybar">
    <div class="tray" id="tray"></div>
  </div>

  <div class="tools">
    <button class="btn" data-tool="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5a5.5 5.5 0 0 1 3.2 9.9l-.4 2.1H9.2l-.4-2.1A5.5 5.5 0 0 1 12 3.5Z"/>
        <path d="M9.8 18.6h4.4"/>
      </svg>
      提示<b class="cnt" id="cntHint">3</b>
    </button>
    <button class="btn" data-tool="undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 10.5h9a4.5 4.5 0 0 1 0 9H9"/><path d="M8.5 6.2 4.2 10.5l4.3 4.3"/>
      </svg>
      撤回<b class="cnt" id="cntUndo">2</b>
    </button>
    <button class="btn" data-tool="shuffle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 6.5h3.2l10 11h3.8"/><path d="M3.5 17.5h3.2L10 13"/><path d="M17.6 3.4 21 6.5l-3.4 3.1"/><path d="M17.6 14.4 21 17.5l-3.4 3.1"/>
      </svg>
      洗牌<b class="cnt" id="cntShuffle">1</b>
    </button>
    <div class="progress">
      槽位 <b id="slotCount">0</b>/7<br>已消 <b id="done">0</b>/<span id="total">8</span>
    </div>
  </div>

  <div class="note" id="note"></div>
  <div class="overlay" id="overlay"></div>
</div>

<script>
(function () {
  'use strict';

    { q: 'K2Cr2O7', el: 'Cr', cg: '', v: 6, w: '2(+1) + 2x + 7(−2) = 0 → x = +6' },
    { q: 'Cr2O7', el: 'Cr', cg: '2-', v: 6, w: '2x + 7(−2) = −2 → x = +6' },
    { q: 'CrO4', el: 'Cr', cg: '2-', v: 6, w: 'x + 4(−2) = −2 → x = +6' },
    { q: 'SO3', el: 'S', cg: '', v: 6, w: 'x + 3(−2) = 0 → x = +6' },

  /* ===== 关卡：层数、网格、每层牌数 ===== */
  var LEVELS = [
    { key: '1', name: '入门', values: [-2, 0, 1, 2],
      layers: [
        { cols: 5, rows: 4, ox: 0, oy: 0, count: 10 },
        { cols: 4, rows: 3, ox: 0.5, oy: 0.6, count: 8 },
        { cols: 3, rows: 2, ox: 1.0, oy: 1.2, count: 6 }
      ] },
    { key: '2', name: '进阶', values: [-3, -1, 3, 4, 5, 6],
      layers: [
        { cols: 5, rows: 4, ox: 0, oy: 0, count: 12 },
        { cols: 4, rows: 4, ox: 0.5, oy: 0.6, count: 10 },
        { cols: 4, rows: 2, ox: 1.0, oy: 1.2, count: 8 },
        { cols: 3, rows: 2, ox: 1.5, oy: 1.8, count: 6 }
      ] },
    { key: '3', name: '挑战', values: [-1, 2, 3, 4, 5, 6, 7],
      layers: [
        { cols: 5, rows: 4, ox: 0, oy: 0, count: 12 },
        { cols: 4, rows: 4, ox: 0.5, oy: 0.6, count: 10 },
        { cols: 4, rows: 3, ox: 1.0, oy: 1.2, count: 8 },
        { cols: 4, rows: 2, ox: 0.9, oy: 1.8, count: 7 },
        { cols: 3, rows: 2, ox: 1.4, oy: 2.4, count: 5 }
      ] }
  ];

  var COLOR = {
    H: 'var(--mint)', C: 'var(--mint)', N: 'var(--mint)', O: 'var(--mint)', P: 'var(--mint)', S: 'var(--mint)',
    F: 'var(--sky)', Cl: 'var(--sky)', Br: 'var(--sky)', I: 'var(--sky)',
    Li: 'var(--butter)', Na: 'var(--butter)', K: 'var(--butter)', Mg: 'var(--butter)', Ca: 'var(--butter)', Al: 'var(--butter)',
    Fe: 'var(--lav)', Cu: 'var(--lav)', Mn: 'var(--lav)', Cr: 'var(--lav)', V: 'var(--lav)'
  };

  var board = document.getElementById('board');
  var stage = document.getElementById('stage');
  var trayEl = document.getElementById('tray');
  var noteEl = document.getElementById('note');
  var overlay = document.getElementById('overlay');
  var tabsEl = document.getElementById('tabs');
  var vchipsEl = document.getElementById('vchips');

  var state = {
    lv: 0, tiles: [], tray: [], W: 5, H: 4.7,
    over: false, lock: false, done: 0, total: 0,
    hints: 3, undos: 2, shuffles: 1, sound: true, noteTimer: null
  };

  /* ---------- 小工具 ---------- */
  function shuffleArr(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function fmtV(v) { return v > 0 ? '+' + v : (v < 0 ? '−' + Math.abs(v) : '0'); }

  function fmlHTML(t) {
    var re = /([A-Z][a-z]?)(\d*)/g, out = '', m;
    while ((m = re.exec(t.q)) !== null) {
      var sym = m[1], n = m[2];
      out += (sym === t.sym ? '<b class="tg">' + sym + '</b>' : sym) + (n ? '<sub>' + n + '</sub>' : '');
    }
    if (t.cg) out += '<sup>' + t.cg + '</sup>';
    return out;
  }

  function faceHTML(t) {
    return '<span class="tile-el" style="background:' + (COLOR[t.sym] || 'var(--mint)') + '">' + t.sym + '</span>' +
      '<span class="tile-fml">' + fmlHTML(t) + '</span>' +
      '<span class="tile-val">' + (t.revealed ? fmtV(t.v) : '') + '</span>';
  }

  /* ---------- 音效 ---------- */
  var actx = null;
  function sfx(kind) {
    if (!state.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      var map = { pick: [520, .06, .05], match: [720, .18, .06], no: [170, .1, .05], undo: [380, .08, .05], win: [880, .35, .06] };
      var p = map[kind] || map.pick, t0 = actx.currentTime;
      var o = actx.createOscillator(), g = actx.createGain();
      o.connect(g); g.connect(actx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(p[0], t0);
      if (kind === 'match') o.frequency.exponentialRampToValueAtTime(p[0] * 1.7, t0 + p[1]);
      g.gain.setValueAtTime(p[2], t0);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + p[1]);
      o.start(t0); o.stop(t0 + p[1] + .03);
    } catch (e) { /* 静默失败 */ }
  }

  /* ---------- 生成关卡 ---------- */
  function buildLevel(lvIdx) {
    var L = LEVELS[lvIdx], tiles = [], id = 0;

    L.layers.forEach(function (cfg, li) {
      var cells = [];
      for (var r = 0; r < cfg.rows; r++) {
        for (var c = 0; c < cfg.cols; c++) cells.push({ x: cfg.ox + c, y: cfg.oy + r * 1.15 });
      }
      shuffleArr(cells);
      for (var k = 0; k < cfg.count && k < cells.length; k++) {
        tiles.push({
          id: ++id, layer: li, x: cells[k].x, y: cells[k].y,
          inTray: false, removed: false, revealed: false,
          v: 0, sym: '', q: '', cg: '', w: '', node: null
        });
      }
    });

    /* 每个化合价 2 组三连，组内尽量用不同物质 */
    var triples = [];
    L.values.forEach(function (v) {
      var pool = shuffleArr(SPECIES.filter(function (s) { return s.v === v; }));
      var rotated = 0;
      for (var t = 0; t < 2; t++) {
        var pick = [];
        for (var i = 0; i < 3; i++) pick.push(pool[(rotated + i) % pool.length]);
        rotated += 1;
        triples.push({ v: v, sp: pick });
      }
    });
    shuffleArr(triples);

    /* 按“从上往下”的可拿顺序分配，使连着的三块同价 → 关卡一定有解 */
    var order = tiles.slice().sort(function (a, b) { return b.layer - a.layer; });
    order.forEach(function (t, i) {
      var tr = triples[Math.floor(i / 3)];
      var sp = tr.sp[i % 3];
      t.v = sp.v; t.sym = sp.el; t.q = sp.q; t.cg = sp.cg; t.w = sp.w;
    });

    var maxX = 0, maxY = 0;
    tiles.forEach(function (t) { maxX = Math.max(maxX, t.x + 1); maxY = Math.max(maxY, t.y + 1.2); });

    return { tiles: tiles, W: maxX, H: maxY };
  }

  /* ---------- 渲染 ---------- */
  function renderBoard() {
    board.innerHTML = '';
    state.tiles.forEach(function (t) {
      var el = document.createElement('div');
      el.className = 'tile';
      el.style.zIndex = String(10 + t.layer * 3);
      el.innerHTML = faceHTML(t);
      el.addEventListener('click', function () { onTile(t); });
      t.node = el;
      board.appendChild(el);
    });
    var peek = document.createElement('div');
    peek.className = 'peek';
    peek.setAttribute('aria-hidden', 'true');
    peek.innerHTML = PEEK_SVG;
    board.appendChild(peek);
  }

  function renderTray(newTile, matched) {
    trayEl.innerHTML = '';
    for (var i = 0; i < 7; i++) {
      var slot = document.createElement('div');
      slot.className = 'slot';
      var t = state.tray[i];
      if (t) {
        slot.className = 'slot filled';
        if (t === newTile) slot.className += ' pop';
        if (matched && matched.indexOf(t) > -1) slot.className += ' matched';
        slot.innerHTML = '<span class="mini-fml">' + fmlHTML(t) + '</span>';
      }
      trayEl.appendChild(slot);
    }
    document.getElementById('slotCount').textContent = String(state.tray.length);
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    LEVELS.forEach(function (L, i) {
      var b = document.createElement('button');
      b.className = 'tab' + (i === state.lv ? ' on' : '');
      b.textContent = '第 ' + L.key + ' 关 · ' + L.name;
      b.addEventListener('click', function () { startLevel(i); sfx('pick'); });
      tabsEl.appendChild(b);
    });
  }

  function renderValues() {
    vchipsEl.innerHTML = '';
    var left = {};
    state.tiles.forEach(function (t) { if (!t.removed) left[t.v] = (left[t.v] || 0) + 1; });
    LEVELS[state.lv].values.forEach(function (v) {
      var c = document.createElement('span');
      c.className = 'vchip' + (left[v] ? '' : ' hit');
      c.textContent = fmtV(v);
      vchipsEl.appendChild(c);
    });
  }

  function updateHud() {
    document.getElementById('done').textContent = String(state.done);
    document.getElementById('total').textContent = String(state.total);
    document.getElementById('cntHint').textContent = String(state.hints);
    document.getElementById('cntUndo').textContent = String(state.undos);
    document.getElementById('cntShuffle').textContent = String(state.shuffles);
    document.getElementById('slotCount').textContent = String(state.tray.length);
    document.querySelector('[data-tool="hint"]').disabled = state.hints <= 0;
    document.querySelector('[data-tool="undo"]').disabled = state.undos <= 0;
    document.querySelector('[data-tool="shuffle"]').disabled = state.shuffles <= 0;
    renderValues();
  }

  /* ---------- 布局 ---------- */
  var laying = false;
  function doLayout() {
    if (!state.tiles.length || laying) return;
    laying = true;
    var aw = stage.clientWidth - 26;
    var ah = stage.clientHeight - 26;
    var s = Math.min(aw / state.W, ah / state.H);
    s = Math.max(s, 34);
    board.style.width = (state.W * s) + 'px';
    board.style.height = (state.H * s) + 'px';
    board.style.setProperty('--s', s.toFixed(2) + 'px');
    state.tiles.forEach(function (t) {
      t.node.style.left = (t.x * s + s * 0.02).toFixed(1) + 'px';
      t.node.style.top = (t.y * s + s * 0.02).toFixed(1) + 'px';
    });
    laying = false;
  }

  /* ---------- 遮挡判定 ---------- */
  function overlapArea(a, b) {
    var ox = Math.min(a.x + 1, b.x + 1) - Math.max(a.x, b.x);
    var oy = Math.min(a.y + 1.2, b.y + 1.2) - Math.max(a.y, b.y);
    return (ox > 0 && oy > 0) ? ox * oy : 0;
  }
  function isBlocked(t) {
    for (var i = 0; i < state.tiles.length; i++) {
      var o = state.tiles[i];
      if (o === t || o.removed || o.inTray) continue;
      if (o.layer > t.layer && overlapArea(t, o) > 0.09) return true;
    }
    return false;
  }
  function updateBlocked() {
    state.tiles.forEach(function (t) {
      if (t.removed || t.inTray) return;
      t.node.classList.toggle('blocked', isBlocked(t));
    });
  }

  /* ---------- 核心操作 ---------- */
  function onTile(t) {
    if (state.over || state.lock || t.inTray || t.removed) return;
    if (isBlocked(t)) {
      sfx('no');
      t.node.classList.remove('shake'); void t.node.offsetWidth; t.node.classList.add('shake');
      return;
    }
    sfx('pick');
    t.inTray = true;
    state.tray.push(t);
    groupTray();
    t.node.classList.add('off');
    updateBlocked();
    renderTray(t);
    afterInsert();
  }

  function groupTray() {
    var order = [];
    state.tray.forEach(function (t) { if (order.indexOf(t.v) < 0) order.push(t.v); });
    state.tray.sort(function (a, b) { return order.indexOf(a.v) - order.indexOf(b.v); });
  }

  function afterInsert() {
    var counts = {};
    state.tray.forEach(function (t) { counts[t.v] = (counts[t.v] || 0) + 1; });
    var hit = Object.keys(counts).filter(function (k) { return counts[k] >= 3; })[0];

    if (hit === undefined) {
      if (state.tray.length >= 7) setTimeout(lose, 220);
      return;
    }

    var v = Number(hit);
    var three = state.tray.filter(function (t) { return t.v === v; }).slice(0, 3);
    state.lock = true;
    renderTray(null, three);
    sfx('match');

    setTimeout(function () {
      three.forEach(function (t) { t.removed = true; t.inTray = false; });
      state.tray = state.tray.filter(function (t) { return three.indexOf(t) < 0; });
      state.done++;
      renderTray(); updateBlocked(); updateHud();
      state.lock = false;
      showNote(three, v);
      var left = state.tiles.filter(function (t) { return !t.removed; }).length;
      if (left === 0 && state.tray.length === 0) { setTimeout(win, 520); }
      else if (state.tray.length >= 7) { setTimeout(lose, 220); }
    }, 380);
  }

  function showNote(three, v) {
    var rows = three.map(function (t) {
      return '<div class="note-row"><span class="note-q">' + fmlHTML(t) + ' 中的 ' + t.sym + '</span>' +
        '<span class="note-w">' + t.w + '</span></div>';
    }).join('');
    noteEl.innerHTML = '<div class="note-head"><span class="note-val">' + fmtV(v) + '</span><span>三块同价，消掉啦</span></div>' + rows;
    noteEl.classList.add('show');
    clearTimeout(state.noteTimer);
    state.noteTimer = setTimeout(function () { noteEl.classList.remove('show'); }, 1900);
  }

  /* ---------- 道具 ---------- */
  function useHint() {
    if (state.over || state.lock || state.hints <= 0) return;
    var cands = state.tiles.filter(function (t) {
      return !t.removed && !t.inTray && !t.revealed && !isBlocked(t);
    });
    if (!cands.length) return;
    var t = cands[Math.floor(Math.random() * cands.length)];
    t.revealed = true;
    state.hints--;
    t.node.innerHTML = faceHTML(t);
    t.node.classList.remove('poke'); void t.node.offsetWidth; t.node.classList.add('poke');
    sfx('pick'); updateHud();
  }

  function useUndo() {
    if (state.over || state.lock || state.undos <= 0 || !state.tray.length) return;
    var t = state.tray[state.tray.length - 1];
    state.tray.pop();
    t.inTray = false;
    t.node.classList.remove('off');
    state.undos--;
    renderTray(); updateBlocked(); updateHud();
    sfx('undo');
  }

  function useShuffle() {
    if (state.over || state.lock || state.shuffles <= 0) return;
    var alive = state.tiles.filter(function (t) { return !t.removed && !t.inTray; });
    if (alive.length < 2) return;
    var payload = alive.map(function (t) { return { v: t.v, sym: t.sym, q: t.q, cg: t.cg, w: t.w }; });
    shuffleArr(payload);
    alive.forEach(function (t, i) {
      t.v = payload[i].v; t.sym = payload[i].sym; t.q = payload[i].q; t.cg = payload[i].cg; t.w = payload[i].w;
      t.node.innerHTML = faceHTML(t);
      t.node.classList.remove('poke'); void t.node.offsetWidth; t.node.classList.add('poke');
    });
    state.shuffles--;
    updateHud();
    sfx('undo');
  }

  /* ---------- 结算 ---------- */
  function closeOverlay() { overlay.classList.remove('show'); overlay.innerHTML = ''; }

  function lose() {
    if (state.over) return;
    state.over = true;
    state.noteTimer && clearTimeout(state.noteTimer);
    noteEl.classList.remove('show');
    sfx('no');
    overlay.innerHTML =
      '<div class="card">' +
      '<h2>槽位满啦</h2>' +
      '<p class="card-sub">7 格里凑不出三块同价 —— 先想清楚再点哦</p>' +
      '<div class="panelbox">' +
      '<h3>本关出现的化合价</h3>' +
      '<p>' + LEVELS[state.lv].values.map(fmtV).join(' &nbsp;·&nbsp; ') + '</p>' +
      '</div>' +
      '<div class="card-actions">' +
      '<button class="btn btn-main" data-act="retry">再来一次</button>' +
      '<button class="btn" data-act="tabs">换一关</button>' +
      '</div>' + SIGN + '</div>';
    overlay.classList.add('show');
  }

  function win() {
    if (state.over) return;
    state.over = true;
    state.noteTimer && clearTimeout(state.noteTimer);
    noteEl.classList.remove('show');
    sfx('win');
    var next = state.lv + 1;
    overlay.innerHTML =
      '<div class="card">' +
      '<h2>全部消完，通关！</h2>' +
      '<p class="card-sub">第 ' + LEVELS[state.lv].key + ' 关 · ' + LEVELS[state.lv].name + ' · 消除 ' + state.done + ' 组</p>' +
      '<div class="panelbox">' +
      '<h3>带走这条口诀</h3>' +
      '<p>化合物里各元素化合价代数和为 0；多原子离子里代数和等于离子电荷。</p>' +
      '</div>' +
      '<div class="card-actions">' +
      (next < LEVELS.length
        ? '<button class="btn btn-main" data-act="next">挑战第 ' + LEVELS[next].key + ' 关</button>'
        : '<button class="btn btn-main" data-act="retry">再玩一遍</button>') +
      '<button class="btn" data-act="retry">重玩本关</button>' +
      '</div>' + SIGN + '</div>';
    overlay.classList.add('show');
  }

  /* ---------- 开局 ---------- */
  function startLevel(i) {
    state.lv = i;
    state.over = false; state.lock = false;
    state.done = 0; state.tray = [];
    state.hints = 3; state.undos = 2; state.shuffles = 1;
    state.noteTimer && clearTimeout(state.noteTimer);
    noteEl.classList.remove('show');
    document.body.setAttribute('data-lv', LEVELS[i].key);

    var built = buildLevel(i);
    state.tiles = built.tiles;
    state.W = built.W; state.H = built.H;
    state.total = LEVELS[i].values.length * 2;

    renderBoard();
    renderTabs();
    renderTray();
    doLayout();
    updateBlocked();
    updateHud();
    closeOverlay();
  }

    if (act === 'start') startLevel(0);
    else if (act === 'retry') startLevel(state.lv);
    else if (act === 'next') startLevel(state.lv + 1);
    else if (act === 'tabs') { closeOverlay(); }
  });

      var tool = b.getAttribute('data-tool');
      if (tool === 'hint') useHint();
      else if (tool === 'undo') useUndo();
      else if (tool === 'shuffle') useShuffle();
    });
  });

  window.addEventListener('orientationchange', function () { setTimeout(doLayout, 260); });

  startLevel(0);
